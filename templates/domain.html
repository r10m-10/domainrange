{% extends 'base.html' %}
{% block head %}
<title>Domain Calculator</title>
{% endblock %}
{% block body %}
<h1> DOMAIN CALCULATOR </h1>
<div class="prompt-wrap">
    <input type="text" id="exp-input" placeholder="Enter an expression...">
</div>
<button id="test-btn">Test expression: 1 / (x^2 - 4) + sqrt(x - 1)</button>
<div id="result-panel">
    <div id="result-header">
        <span id="result-label">OUTPUT</span>
        <button id="download-svg-btn" type="button" aria-label="Download SVG" title="Download SVG">⬇</button>
    </div>
    <div id="result"></div>
</div>
<div id="tool-nav"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/exp_input.js')}}"></script>
<script src="{{ url_for('static', filename='js/domain.js')}}"></script>
{% endblock %}
